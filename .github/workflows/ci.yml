name: Verify CareIntake
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: careintake
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: careintake_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U careintake"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: pytest backend/tests -q
      - run: python scripts/postgres_smoke.py
        env:
          TEST_DATABASE_URL: postgresql+psycopg://careintake:test-password@localhost:5432/careintake_test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
